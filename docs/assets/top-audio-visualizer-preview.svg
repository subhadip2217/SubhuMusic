<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1320" viewBox="0 0 900 1320" role="img" aria-labelledby="title desc">
<title id="title">SubhuMusic live audio visualizer feature preview</title>
<desc id="desc">A SubhuMusic app screen concept showing an artwork-tinted floating capsule with a real-time equalizer, current track artwork, and the artwork-following background setting.</desc>
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17162f"/><stop offset=".52" stop-color="#0c1423"/><stop offset="1" stop-color="#080b14"/></linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8064c5"/><stop offset=".48" stop-color="#514181"/><stop offset="1" stop-color="#244f68"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a88cff"/><stop offset="1" stop-color="#69dce7"/></linearGradient>
  <linearGradient id="coverSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#120b39"/><stop offset=".52" stop-color="#473c9d"/><stop offset="1" stop-color="#09192e"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8d43ef"/><stop offset=".45" stop-color="#44d4db"/><stop offset="1" stop-color="#4636a2"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="coverClip"><rect x="172" y="700" width="556" height="430" rx="34"/></clipPath>
</defs>
<rect width="900" height="1320" rx="42" fill="url(#screen)"/>
<circle cx="145" cy="180" r="190" fill="#7449d6" opacity=".24" filter="url(#blur)"/>
<circle cx="800" cy="560" r="210" fill="#16a9b5" opacity=".13" filter="url(#blur)"/>
<g fill="#fff" opacity=".55">
 <circle cx="105" cy="270" r="2"/><circle cx="214" cy="125" r="2"/><circle cx="755" cy="160" r="2"/><circle cx="805" cy="300" r="1.7"/><circle cx="670" cy="90" r="1.5"/>
</g>
<g font-family="Arial, sans-serif">
  <text x="62" y="62" fill="#fff" font-size="19" font-weight="700">9:41</text>
  <g transform="translate(760 44)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M0 14h22M5 8v12M12 4v16M19 10v10"/><rect x="42" y="3" width="46" height="22" rx="6"/><path d="M90 10v8"/></g>
  <text x="62" y="150" fill="#fff" font-size="40" font-weight="700">Subhu</text><text x="181" y="150" fill="#b9a4ff" font-size="40" font-weight="700">Music</text>
  <text x="64" y="184" fill="#aaa8c4" font-size="12" letter-spacing="3" font-weight="700">YOUR MUSIC. YOUR SPACE.</text>
  <text x="64" y="265" fill="#bba8ff" font-size="14" letter-spacing="3" font-weight="700">LIVE AUDIO VISUALIZER</text>
  <text x="64" y="320" fill="#fff" font-size="43" font-weight="700">Feel every beat.</text>
  <text x="64" y="365" fill="#c7c2dd" font-size="23">See your music come alive.</text>
</g>
<!-- Floating capsule, artwork-derived background -->
<rect x="42" y="418" width="816" height="170" rx="85" fill="#000" opacity=".38" filter="url(#shadow)"/>
<rect x="44" y="402" width="812" height="164" rx="82" fill="url(#pill)" stroke="#d5c8ff" stroke-opacity=".55" stroke-width="2"/>
<rect x="52" y="410" width="796" height="148" rx="74" fill="none" stroke="#fff" stroke-opacity=".10"/>
<!-- stylised cover thumb -->
<circle cx="132" cy="484" r="52" fill="#1c163e" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
<g transform="translate(80 432)">
 <clipPath id="thumbClip"><circle cx="52" cy="52" r="49"/></clipPath>
 <g clip-path="url(#thumbClip)">
  <rect width="104" height="104" fill="url(#coverSky)"/>
  <path d="M-8 43C20 2 34 9 56 30S88 56 115 6L115 30C78 89 45 13 -8 73Z" fill="url(#aurora)" opacity=".92"/>
  <path d="M-8 88 20 62 43 76 70 54 112 82 112 116 -8 116Z" fill="#11182e"/>
  <path d="M-5 101 28 77 48 90 78 69 110 93 110 116 -5 116Z" fill="#080e1b"/>
  <g fill="#fff" opacity=".85"><circle cx="20" cy="16" r="1.5"/><circle cx="85" cy="19" r="1.2"/><circle cx="67" cy="43" r="1.1"/></g>
 </g>
</g>
<g font-family="Arial, sans-serif">
 <text x="218" y="454" fill="#e5dfff" font-size="12" font-weight="700" letter-spacing="2">NOW PLAYING</text>
 <text x="218" y="493" fill="#fff" font-size="25" font-weight="700">Northern Lights</text>
 <text x="218" y="522" fill="#e4def7" opacity=".82" font-size="15">SubhuMusic Sessions</text>
 <text x="726" y="544" fill="#d7f9ed" font-size="10" font-weight="700" letter-spacing="2">LIVE</text>
</g>
<!-- Genuine-looking spectrum bars: static preview of the audio-reactive state -->
<g fill="#d4c5ff">
 <rect x="512" y="468" width="7" height="28" rx="3.5"/><rect x="528" y="456" width="7" height="52" rx="3.5"/><rect x="544" y="444" width="7" height="76" rx="3.5"/>
 <rect x="560" y="462" width="7" height="40" rx="3.5"/><rect x="576" y="434" width="7" height="96" rx="3.5"/><rect x="592" y="450" width="7" height="64" rx="3.5"/>
 <rect x="608" y="428" width="7" height="108" rx="3.5"/><rect x="624" y="460" width="7" height="44" rx="3.5"/><rect x="640" y="442" width="7" height="80" rx="3.5"/>
 <rect x="656" y="452" width="7" height="60" rx="3.5"/><rect x="672" y="430" width="7" height="104" rx="3.5"/><rect x="688" y="458" width="7" height="48" rx="3.5"/>
 <rect x="704" y="446" width="7" height="72" rx="3.5"/><rect x="720" y="462" width="7" height="40" rx="3.5"/><rect x="736" y="450" width="7" height="64" rx="3.5"/>
</g>
<g fill="#79e4e5">
 <rect x="520" y="480" width="7" height="17" rx="3.5"/><rect x="568" y="472" width="7" height="26" rx="3.5"/><rect x="616" y="458" width="7" height="42" rx="3.5"/><rect x="664" y="476" width="7" height="22" rx="3.5"/><rect x="712" y="468" width="7" height="34" rx="3.5"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="450" y="645" fill="#bdaaff" font-size="13" font-weight="700" letter-spacing="3">YOUR FULL PLAYER</text>
 <text x="450" y="685" fill="#fff" font-size="27" font-weight="700">Artwork-inspired listening</text>
</g>
<!-- Album image illustration -->
<rect x="172" y="700" width="556" height="430" rx="34" fill="#050813" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
<g clip-path="url(#coverClip)">
 <rect x="172" y="700" width="556" height="430" fill="url(#coverSky)"/>
 <path d="M130 900C240 710 340 810 415 875S580 940 770 705L770 825C590 1020 500 800 365 885S210 1020 130 990Z" fill="url(#aurora)" opacity=".94"/>
 <path d="M140 1055 250 910 325 986 410 902 525 1004 627 900 780 1047 780 1180 140 1180Z" fill="#101b34"/>
 <path d="M140 1100 255 1000 340 1050 440 965 535 1054 650 980 780 1090 780 1180 140 1180Z" fill="#080e1b"/>
 <g fill="#fff" opacity=".7"><circle cx="270" cy="760" r="3"/><circle cx="640" cy="758" r="2"/><circle cx="470" cy="790" r="2"/><circle cx="350" cy="835" r="1.5"/><circle cx="700" cy="850" r="1.5"/></g>
 <path d="M485 1040c-22-45-11-86 7-105 24 14 37 48 28 82l35 43h-91Z" fill="#060a16"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="450" y="1180" fill="#fff" font-size="25" font-weight="700">Northern Lights</text>
 <text x="450" y="1210" fill="#b6b2c8" font-size="15">SubhuMusic Sessions</text>
</g>
<rect x="112" y="1240" width="676" height="8" rx="4" fill="#fff" fill-opacity=".20"/>
<rect x="112" y="1240" width="392" height="8" rx="4" fill="url(#violet)"/>
<circle cx="504" cy="1244" r="9" fill="#fff"/>
</svg>