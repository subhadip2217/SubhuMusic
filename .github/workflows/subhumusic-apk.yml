name: Build SubhuMusic APK

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/subhumusic-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SubhuMusic
        uses: actions/checkout@v4
        with:
          repository: subhadip2217/SubhuMusic
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package was removed from Google's SDK repository.
          # Install only platform-tools; Android Gradle Plugin resolves the required
          # platform and build-tools packages for compileSdk automatically.
          packages: platform-tools

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload SubhuMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: SubhuMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
