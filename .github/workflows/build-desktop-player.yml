name: Build SubhuMusic Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - web-player
    paths:
      - "desktop-player/**"
      - ".github/workflows/build-desktop-player.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-player/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SubhuMusic-Desktop-Windows
          path: desktop-player/dist/*.exe
          if-no-files-found: error
          retention-days: 14
