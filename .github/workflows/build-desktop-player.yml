name: Build SubhuMusic Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - web-player
    paths:
      - "desktop-player/**"
      - ".github/workflows/build-desktop-player.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download yt-dlp stream engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          if ((Get-Item "bin/yt-dlp.exe").Length -lt 1000000) { throw "yt-dlp download looks incomplete" }
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-unpacked" -Force
          Copy-Item "deno-unpacked/deno.exe" "bin/deno.exe"
          if ((Get-Item "bin/deno.exe").Length -lt 1000000) { throw "Deno download looks incomplete" }
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SubhuMusic-Desktop-Windows
          path: desktop-player/dist/*.exe
          if-no-files-found: error
          retention-days: 14
